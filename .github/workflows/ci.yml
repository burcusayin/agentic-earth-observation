name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only checks code, it never writes to the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, tests, commit checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to a full commit SHA (tag in the comment) so a moved tag cannot change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the secret scan reads the whole history

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: true

      - name: Install Python and the locked dependencies
        run: uv sync --locked --managed-python

      - name: make check
        run: make check

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # The same checks as on every commit. mypy already ran in make check. Nothing is staged here, so the
      # gitleaks hook finds nothing, and the private-strings hook only checks the names of the tracked files.
      - name: Commit checks on all files
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: mypy

      - name: Secret scan of the whole history
        run: uv run pre-commit run --hook-stage manual gitleaks-history --all-files
