[project]
name = "agentic-earth-observation"
version = "0.1.0"
description = "A multi-agent Earth Observation assistant (LangGraph, MCP, A2A) and an evaluation of its tool use."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Burcu Sayin" }]
requires-python = ">=3.13"
# mcp stays below 2.0 because langchain-mcp-adapters 0.3.x requires mcp<2.
dependencies = [
    "a2a-sdk[http-server]>=1.2.2,<2",
    "httpx>=0.28.1,<1",
    "langchain-core>=1.6.9,<2",
    "langchain-mcp-adapters>=0.3.2,<0.4",
    "langchain-mistralai>=1.1.6,<2",
    "langchain-ollama>=1.1.0,<2",
    "langgraph>=1.2.14,<1.3",
    "mcp>=1.30.0,<2",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
    "pystac-client>=0.9.0,<0.10",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168",
    "mypy==2.4.0",
    "pre-commit>=4.6",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "pytest-recording>=0.14",
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_earth_observation"]

[tool.ruff]
line-length = 110
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "PT", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest checks

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests", "scripts"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--block-network", "-m", "not integration and not live"]
markers = [
    "integration: needs local servers and Ollama; run with `uv run pytest -m integration --allowed-hosts=127.0.0.1,localhost`",
    "live: calls a public API or a paid model; never runs in CI",
]

[tool.coverage.run]
source = ["agentic_earth_observation"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
