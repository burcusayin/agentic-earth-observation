[project]
name = "agentic-earth-observation"
version = "0.1.0"
description = "A small agentic Earth Observation assistant: LangGraph orchestration, an MCP server over a STAC catalogue, A2A delegation, and an evaluation of tool use."
requires-python = ">=3.11"
# Versions are left open on purpose: pin them after the first working install (pip freeze > requirements.lock).
dependencies = [
    "langgraph",
    "langchain-core",
    "langchain-mcp-adapters",
    "mcp",
    "a2a-sdk",
    "pystac-client",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eo_agent_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
