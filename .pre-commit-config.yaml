# Installs both the pre-commit and the commit-msg hooks with `pre-commit install` (make setup).
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.24
    hooks:
      - id: uv-lock
        args: ["--check"]  # verify the lock file; never rewrite it during a commit

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: private-strings
        name: private files and strings
        entry: scripts/check_private_strings.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]
      - id: private-strings-message
        name: commit message (private strings, co-author lines)
        entry: scripts/check_private_strings.sh
        language: script
        stages: [commit-msg]
